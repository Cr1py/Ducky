[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ducky"
version = "0.1.0"
description = "A duck in your terminal you can walk your problems through."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "platformdirs>=4",
    "pydantic>=2",
    "tomli-w>=1",
    "ollama>=0.6.3",
    "openai>=2.54.0",
    "anthropic>=1.12.1",
    "httpx2>=2.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]

[project.scripts]
ducky = "ducky.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ducky"]

[tool.pytest.ini_options]
testpaths = ["tests"]
